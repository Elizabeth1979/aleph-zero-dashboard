<style>
.skip-link {
  position: fixed;
  inset-block-start: .5rem;
  inset-inline-start: .5rem;
  padding: .75rem 1rem;
  background: var(--accent);
  color: var(--bg);
  border-radius: var(--r1);
  transform: translateY(-150%);
}
.skip-link:focus { transform: translateY(0); }
.back-link, .filter-button, .modal-close, .source-link { min-height: 44px; }

.filter-section { margin-block-end: var(--s4); }
.filter-label {
  margin-block-end: var(--s2);
  color: var(--text-2);
  font-size: var(--fs-sm);
  font-weight: 600;
}
.filter-bar { display: flex; flex-wrap: wrap; gap: var(--s2); }
.filter-button {
  padding: .55rem .8rem;
  color: var(--text-2);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--pill);
  font: inherit;
  cursor: pointer;
}
.filter-button[aria-pressed="true"] {
  color: var(--bg);
  background: var(--accent);
  border-color: var(--accent);
}
.filter-button:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.library-summary {
  margin-block: var(--s5) var(--s3);
  color: var(--text-2);
  font-size: var(--fs-sm);
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--s4);
}
.report-card {
  width: 100%;
  min-height: 220px;
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  text-align: start;
  color: inherit;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  font: inherit;
  cursor: pointer;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.report-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 4px 16px rgba(0,0,0,.25);
}
.card-accent { height: 4px; flex-shrink: 0; background: #14b8a6; }
.card-body { padding: var(--s4); display: flex; flex-direction: column; flex: 1; }
.card-meta { display: flex; flex-wrap: wrap; gap: var(--s2); margin-block-end: var(--s3); }
.type-badge {
  padding: .2rem .55rem;
  border-radius: var(--pill);
  color: #14b8a6;
  background: rgba(20,184,166,.15);
  font-size: var(--fs-xs);
  font-weight: 600;
}
.status-badge { color: var(--text-2); background: var(--bg-inset); }
.card-title { color: var(--text); font-size: 1rem; font-weight: 700; line-height: 1.35; }
.card-date { margin-block: .25rem .5rem; color: var(--text-3); font-size: var(--fs-xs); }
.card-preview {
  color: var(--text-2);
  font-size: var(--fs-sm);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.empty { padding: var(--s6); text-align: center; color: var(--text-3); }

.modal-overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: var(--s3);
  overflow-y: auto;
  background: rgba(0,0,0,.7);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}
.modal-overlay[hidden] { display: none; }
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-box {
  width: min(800px, 92vw);
  margin-block: auto;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r3);
  transform: scale(.96);
  transition: transform .2s ease;
}
.modal-overlay.open .modal-box { transform: scale(1); }
.modal-header {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  padding: var(--s5);
  border-bottom: 1px solid var(--border);
}
.modal-header-info { flex: 1; min-width: 0; }
.modal-header-title { color: var(--text); font-size: 1.15rem; font-weight: 700; }
.modal-header-meta { display: flex; flex-wrap: wrap; gap: var(--s2); margin-block-start: var(--s2); color: var(--text-3); font-size: var(--fs-xs); }
.modal-close {
  min-width: 44px;
  padding: .5rem;
  color: var(--text-2);
  background: transparent;
  border: 0;
  border-radius: var(--r1);
  cursor: pointer;
}
.modal-body { padding: var(--s5); color: var(--text); line-height: 1.65; }
.detail-section + .detail-section { margin-block-start: var(--s5); }
.detail-section h2 { margin-block-end: var(--s2); color: var(--accent); font-size: 1rem; }
.detail-section h3 { margin-block: var(--s3) var(--s2); color: var(--text); font-size: var(--fs-sm); }
.detail-section ul { padding-inline-start: 1.25rem; }
.source-links { display: flex; flex-wrap: wrap; gap: var(--s2); }
.source-link {
  display: inline-flex;
  align-items: center;
  padding: .5rem .75rem;
  color: var(--accent);
  border: 1px solid var(--border);
  border-radius: var(--r1);
}

@media (max-width: 960px) { .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) {
  .page-wrap { padding: var(--s4) var(--s3); }
  .card-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none; transition: none; }
}
</style>

<body>
<a class="skip-link" href="#main-content">Skip to knowledge</a>
<div class="page-wrap">
  <header class="page-header">
    <a href="../index.html" class="back-link">
      <i data-lucide="arrow-left" aria-hidden="true" style="width:16px;height:16px"></i> Dashboard
    </a>
    <h1 class="page-title"><i data-lucide="library" aria-hidden="true"></i> Knowledge</h1>
  </header>
  <main id="main-content">
    <section class="filter-section" aria-labelledby="subject-filter-label">
      <h2 class="filter-label" id="subject-filter-label">Subject</h2>
      <div class="filter-bar" id="subject-filters">
        <button type="button" class="filter-button" data-subject="All" aria-pressed="true">All</button>
        <button type="button" class="filter-button" data-subject="Economics" aria-pressed="false">Economics</button>
        <button type="button" class="filter-button" data-subject="History" aria-pressed="false">History</button>
        <button type="button" class="filter-button" data-subject="Self-Improvement" aria-pressed="false">Self-Improvement</button>
        <button type="button" class="filter-button" data-subject="AI" aria-pressed="false">AI</button>
        <button type="button" class="filter-button" data-subject="Intelligence &amp; Security" aria-pressed="false">Intelligence &amp; Security</button>
        <button type="button" class="filter-button" data-subject="Politics" aria-pressed="false">Politics</button>
        <button type="button" class="filter-button" data-subject="Neuroscience" aria-pressed="false">Neuroscience</button>
        <button type="button" class="filter-button" data-subject="Education" aria-pressed="false">Education</button>
        <button type="button" class="filter-button" data-subject="Accessibility" aria-pressed="false">Accessibility</button>
        <button type="button" class="filter-button" data-subject="Technology" aria-pressed="false">Technology</button>
        <button type="button" class="filter-button" data-subject="Uncategorized" aria-pressed="false">Uncategorized</button>
      </div>
    </section>
    <section class="filter-section" aria-labelledby="view-filter-label">
      <h2 class="filter-label" id="view-filter-label">View</h2>
      <div class="filter-bar" id="view-filters">
        <button type="button" class="filter-button" data-view="All" aria-pressed="true">All</button>
        <button type="button" class="filter-button" data-view="Blog material" aria-pressed="false">Blog material</button>
        <button type="button" class="filter-button" data-view="To explore" aria-pressed="false">To explore</button>
      </div>
    </section>
    <p class="library-summary" id="library-summary" aria-live="polite"></p>
    <div class="card-grid" id="knowledge-grid"></div>
  </main>
</div>

<div class="modal-overlay" id="report-modal" aria-hidden="true" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <div class="modal-header-info">
        <div class="modal-header-title" id="modal-title"></div>
        <div class="modal-header-meta">
          <span id="modal-subject"></span>
          <span id="modal-status"></span>
          <span id="modal-date"></span>
        </div>
      </div>
      <button type="button" class="modal-close" id="modal-close-btn" aria-label="Close details">
        <i data-lucide="x" aria-hidden="true" style="width:20px;height:20px"></i>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="utils.js?v=5"></script>
<script src="../data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const APPROVED_SUBJECTS = ['Economics', 'History', 'Self-Improvement', 'AI', 'Intelligence & Security', 'Politics', 'Neuroscience', 'Education', 'Accessibility', 'Technology', 'Uncategorized'];
  const d = window.__DASHBOARD_DATA__ || {};
  const reports = (d.reports || []).filter(report => report.type === 'research');
  const resources = (d.resources || []).filter(resource => resource.title);
  const project001 = (d.project_001_insights || []).filter(insight => insight.title);

  function stripMd(text) {
    return (text || '')
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/\*(.+?)\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^#+\s*/gm, '')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
      .trim();
  }

  function inferReportSubject(report) {
    const text = `${report.title || ''} ${report.file || ''} ${report.preview || ''}`.toLowerCase();
    if (/accessib|a11y|wcag|screen reader/.test(text)) return 'Accessibility';
    if (/artificial intelligence|\bai\b|agent|model|llm/.test(text)) return 'AI';
    if (/neuroscience|brain|cognitive/.test(text)) return 'Neuroscience';
    if (/education|school|teaching|learning|student/.test(text)) return 'Education';
    if (/security|intelligence|osint|surveillance/.test(text)) return 'Intelligence & Security';
    if (/econom/.test(text)) return 'Economics';
    if (/histor/.test(text)) return 'History';
    if (/politic|government|election/.test(text)) return 'Politics';
    if (/technolog|software|web|css|code/.test(text)) return 'Technology';
    return 'Uncategorized';
  }

  function approvedSubject(subject) {
    return APPROVED_SUBJECTS.includes(subject) ? subject : 'Uncategorized';
  }

  const items = [
    ...resources.map(resource => ({
      sourceId: `resource:${resource.id}`,
      title: resource.title,
      subject: approvedSubject(resource.subject),
      tags: Array.isArray(resource.tags) ? resource.tags : [],
      status: resource.status || 'New',
      date: resource.added || '',
      summary: resource.note || '',
      keyPoints: resource.takeaways || [],
      takeaway: resource.takeaway || '',
      sourceText: resource.source_title || resource.source || '',
      links: resource.url ? [{ label: 'Open source', url: resource.url }] : [],
      sourceLanguage: resource.source_language || 'en',
      biasNote: resource.bias_note || '',
      blogAngle: resource.blog_angle || '',
      youngReader: resource.young_reader || null,
      content: '',
    })),
    ...reports.map(report => ({
      sourceId: `report:${report.file}`,
      title: report.title || report.file,
      subject: approvedSubject(report.subject || inferReportSubject(report)),
      tags: Array.isArray(report.tags) ? report.tags : [],
      status: report.status || 'Processed',
      date: report.date || '',
      summary: stripMd(report.preview || ''),
      keyPoints: [],
      takeaway: report.takeaway || '',
      sourceText: report.file || '',
      links: Array.isArray(report.links) ? report.links : [],
      sourceLanguage: report.source_language || 'en',
      biasNote: report.bias_note || '',
      blogAngle: report.blog_angle || '',
      youngReader: report.young_reader || null,
      content: report.content || '',
    })),
    ...project001.map(insight => ({
      sourceId: `project-001:${insight.id}`,
      title: insight.title,
      subject: approvedSubject(insight.subject),
      tags: Array.isArray(insight.tags) ? insight.tags : [],
      status: insight.status || 'Processed',
      date: insight.date || '',
      summary: insight.summary || '',
      keyPoints: insight.points || [],
      takeaway: insight.takeaway || '',
      sourceText: insight.source || '',
      links: insight.links || [],
      sourceLanguage: insight.source_language || 'en',
      biasNote: insight.bias_note || '',
      blogAngle: insight.blog_angle || '',
      youngReader: insight.young_reader || null,
      content: '',
    })),
  ];
  const itemsBySourceId = new Map(items.map(item => [item.sourceId, item]));
  let selectedSubject = 'All';
  let selectedView = 'All';
  let lastFocused = null;

  const grid = document.querySelector('#knowledge-grid');
  const summary = document.querySelector('#library-summary');
  const overlay = document.querySelector('#report-modal');
  const modalTitle = document.querySelector('#modal-title');
  const modalSubject = document.querySelector('#modal-subject');
  const modalStatus = document.querySelector('#modal-status');
  const modalDate = document.querySelector('#modal-date');
  const modalBody = document.querySelector('#modal-body');
  const closeButton = document.querySelector('#modal-close-btn');

  function matchesView(item) {
    if (selectedView === 'All') return true;
    if (selectedView === 'Blog material') return item.tags.includes('Blog material');
    return item.status.toLowerCase() === 'to explore';
  }

  function renderCards() {
    const visible = items.filter(item =>
      (selectedSubject === 'All' || item.subject === selectedSubject) && matchesView(item)
    );
    summary.textContent = `${visible.length} ${visible.length === 1 ? 'item' : 'items'} shown`;
    if (!visible.length) {
      grid.innerHTML = '<div class="empty">No knowledge matches these filters</div>';
      return;
    }
    grid.innerHTML = visible.map(item => `
      <button type="button" class="report-card" data-source-id="${esc(item.sourceId)}" aria-label="Open ${esc(item.title)}">
        <span class="card-accent"></span>
        <span class="card-body">
          <span class="card-meta">
            <span class="type-badge">${esc(item.subject)}</span>
            <span class="type-badge status-badge">${esc(item.status)}</span>
          </span>
          <span class="card-title">${esc(item.title)}</span>
          <span class="card-date">${esc(item.date)}</span>
          <span class="card-preview">${esc(item.summary)}</span>
        </span>
      </button>
    `).join('');
  }

  function detailSection(title, content) {
    if (!content) return '';
    return `<section class="detail-section"><h2>${esc(title)}</h2>${content}</section>`;
  }

  function openModal(item, trigger) {
    lastFocused = trigger;
    modalTitle.textContent = item.title;
    modalSubject.textContent = item.subject;
    modalStatus.textContent = item.status;
    modalDate.textContent = item.date;

    const summaryHtml = item.content ? renderMd(item.content) : `<p>${esc(item.summary)}</p>`;
    const pointsHtml = item.keyPoints.length
      ? `<ul>${item.keyPoints.map(point => `<li>${esc(point)}</li>`).join('')}</ul>`
      : '<p>No separate key points recorded.</p>';
    const linksHtml = item.links.length
      ? `<div class="source-links">${item.links.map(link => `<a class="source-link" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">${esc(link.label || link.url)}</a>`).join('')}</div>`
      : '<p>No external link recorded.</p>';
    const sourceMeta = item.sourceText
      ? `<p>${esc(item.sourceText)}</p><p>Source language: ${esc(item.sourceLanguage)}</p>`
      : `<p>Source language: ${esc(item.sourceLanguage)}</p>`;
    const young = item.youngReader;
    const youngReaderHtml = young
      ? `<p>${esc(young.summary || '')}</p>`
        + (young.key_points?.length
          ? `<h3>Key ideas</h3><ul>${young.key_points.map(point => `<li>${esc(point)}</li>`).join('')}</ul>`
          : '')
      : '';
    const activitiesHtml = young?.activities?.length
      ? `<ul>${young.activities.map(activity => `<li>${esc(activity)}</li>`).join('')}</ul>`
      : '';
    const qualityHtml = young
      ? `<p><strong>Verdict:</strong> ${esc(young.verdict || '')}</p>`
        + `<p><strong>Target:</strong> Grades ${esc(young.target_grades || '')}</p>`
        + `<p><strong>Measured reading grade:</strong> ${esc(young.reading_grade ?? 'Not measured')}</p>`
        + `<p>${esc(young.quality_note || '')}</p>`
      : '';

    modalBody.innerHTML = [
      detailSection('Standard Summary', summaryHtml),
      detailSection('Standard Key Points', pointsHtml),
      detailSection('Why it matters / takeaway', `<p>${esc(item.takeaway || 'No separate takeaway recorded.')}</p>`),
      detailSection('Young Reader Version', youngReaderHtml),
      detailSection('Try It Yourself', activitiesHtml),
      detailSection('Young Reader Quality Review', qualityHtml),
      detailSection('Sources', sourceMeta + linksHtml),
      detailSection('Bias / reliability note', `<p>${esc(item.biasNote || 'No separate bias or reliability note recorded.')}</p>`),
      detailSection('Blog / story angle', `<p>${esc(item.blogAngle || 'No separate blog or story angle recorded.')}</p>`),
    ].join('');
    overlay.removeAttribute('hidden');
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    closeButton.focus();
  }

  function closeModal() {
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    overlay.setAttribute('hidden', '');
    document.body.style.overflow = '';
    if (lastFocused) lastFocused.focus();
  }

  function setupFilterBar(selector, dataKey, onSelect) {
    const bar = document.querySelector(selector);
    bar.addEventListener('click', event => {
      const button = event.target.closest(`button[${dataKey}]`);
      if (!button) return;
      bar.querySelectorAll('button').forEach(candidate => candidate.setAttribute('aria-pressed', String(candidate === button)));
      onSelect(button.getAttribute(dataKey));
      renderCards();
    });
  }

  setupFilterBar('#subject-filters', 'data-subject', value => { selectedSubject = value; });
  setupFilterBar('#view-filters', 'data-view', value => { selectedView = value; });
  grid.addEventListener('click', event => {
    const card = event.target.closest('[data-source-id]');
    if (!card) return;
    const item = itemsBySourceId.get(card.dataset.sourceId);
    if (item) openModal(item, card);
  });
  closeButton.addEventListener('click', closeModal);
  overlay.addEventListener('click', event => { if (event.target === overlay) closeModal(); });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && overlay.classList.contains('open')) closeModal();
    if (event.key === 'Tab' && overlay.classList.contains('open')) {
      const focusable = [...overlay.querySelectorAll('button, a[href]')];
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
  });

  renderCards();
  if (typeof lucide !== 'undefined') lucide.createIcons();

  const params = new URLSearchParams(window.location.search);
  const openFile = params.get('open');
  if (openFile) {
    const target = items.find(item => item.sourceId === `report:${openFile}`);
    if (target) openModal(target, null);
  }
});
</script>
