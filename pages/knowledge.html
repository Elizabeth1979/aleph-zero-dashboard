<style>
.skip-link {
  position: fixed;
  inset-block-start: .5rem;
  inset-inline-start: .5rem;
  padding: .75rem 1rem;
  background: var(--accent);
  color: var(--bg);
  border-radius: var(--r1);
  transform: translateY(-150%);
}
.skip-link:focus { transform: translateY(0); }
.back-link, .filter-button, .modal-close, .source-link, .read-aloud-button, .read-aloud-speed { min-height: 44px; }

.filter-section { margin-block-end: var(--s4); }
.filter-label {
  margin-block-end: var(--s2);
  color: var(--text-2);
  font-size: var(--fs-sm);
  font-weight: 600;
}
.filter-bar { display: flex; flex-wrap: wrap; gap: var(--s2); }
.filter-button {
  padding: .55rem .8rem;
  color: var(--text-2);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--pill);
  font: inherit;
  cursor: pointer;
}
.filter-button[aria-pressed="true"] {
  color: var(--bg);
  background: var(--accent);
  border-color: var(--accent);
}
.filter-button:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.library-summary {
  margin-block: var(--s5) var(--s3);
  color: var(--text-2);
  font-size: var(--fs-sm);
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--s4);
}
.report-card {
  width: 100%;
  min-height: 220px;
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  text-align: start;
  color: inherit;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  font: inherit;
  cursor: pointer;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.report-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 4px 16px rgba(0,0,0,.25);
}
.card-accent { height: 4px; flex-shrink: 0; background: #14b8a6; }
.card-body { padding: var(--s4); display: flex; flex-direction: column; flex: 1; }
.card-meta { display: flex; flex-wrap: wrap; gap: var(--s2); margin-block-end: var(--s3); }
.type-badge {
  padding: .2rem .55rem;
  border-radius: var(--pill);
  color: #14b8a6;
  background: rgba(20,184,166,.15);

}

.card-title { color: var(--text); font-size: 1rem; font-weight: 700; line-height: 1.35; }
.card-date { margin-block: .25rem .5rem; color: var(--text-3); font-size: var(--fs-xs); }
.card-preview {
  color: var(--text-2);
  font-size: var(--fs-sm);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.empty { padding: var(--s6); text-align: center; color: var(--text-3); }

.modal-overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: var(--s3);
  overflow-y: auto;
  background: rgba(0,0,0,.7);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}
.modal-overlay[hidden] { display: none; }
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-box {
  width: min(800px, 92vw);
  margin-block: auto;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r3);
  transform: scale(.96);
  transition: transform .2s ease;
}
.modal-overlay.open .modal-box { transform: scale(1); }
.modal-header {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);

  border-bottom: 1px solid var(--border);
}

.modal-header-title { color: var(--text); font-size: 1.15rem; font-weight: 700; }
.modal-header-meta { display: flex; flex-wrap: wrap; gap: var(--s2); margin-block-start: var(--s2); color: var(--text-3); font-size: var(--fs-xs); }
.read-aloud-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s2);
  margin-block-start: var(--s3);
}
.read-aloud-button, .read-aloud-speed {
  padding: .55rem .75rem;
  color: var(--text);
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--r1);

}
.read-aloud-button {
  display: inline-flex;
  align-items: center;
  gap: .4rem;

}
.read-aloud-button:first-child { color: var(--bg); background: var(--accent); border-color: var(--accent); }
.read-aloud-button:disabled, .read-aloud-speed:disabled { opacity: .55; cursor: not-allowed; }
.read-aloud-button svg { width: 17px; height: 17px; }

.detail-section ul { padding-inline-start: 1.25rem; }
.evidence-claims { display: grid; gap: var(--s4); }
.evidence-claim { padding: var(--s4); background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r2); }
.claim-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); }
.claim-label { flex-shrink: 0; padding: .2rem .55rem; border-radius: var(--pill); font-size: var(--fs-xs); font-weight: 700; }
.claim-verified { color: var(--accent); background: var(--accent-muted); }
.claim-disputed { color: #fbbf24; background: rgba(251,191,36,.12); }
.claim-viewpoint { color: #c4b5fd; background: rgba(196,181,253,.12); }
.claim-needs-evidence { color: var(--text-2); background: var(--bg-card); }
.citation-list { display: grid; gap: var(--s2); margin-block-start: var(--s3); }
.citation-list a { overflow-wrap: anywhere; color: var(--accent); }
.rubric-list { display: grid; grid-template-columns: minmax(150px, .35fr) 1fr; gap: var(--s3); }
.rubric-list dt { color: var(--accent); font-weight: 700; }
.rubric-list dd { margin: 0; color: var(--text-2); }
.source-links { display: flex; flex-wrap: wrap; gap: var(--s2); }
.source-link {
  display: inline-flex;
  align-items: center;
  padding: .5rem .75rem;
  color: var(--accent);
  border: 1px solid var(--border);
  border-radius: var(--r1);
}
.draft-disclosure, .publication-lock {
  padding: var(--s3);
  color: var(--text-2);
  background: var(--bg-inset);
  border-inline-start: 3px solid var(--accent);
  border-radius: var(--r1);
}
.draft-article { display: grid; gap: var(--s4); }
.draft-article > h3 { margin-block: 0; font-size: 1.1rem; }
.draft-section { padding-block-start: var(--s2); }
.draft-section p { color: var(--text-2); }
.inline-citations { display: inline-flex; gap: .2rem; margin-inline-start: .25rem; }
.inline-citations a { color: var(--accent); font-size: var(--fs-xs); font-weight: 700; }
.faq-list, .self-check-list { display: grid; gap: var(--s3); }
.faq-item, .self-check-item { padding: var(--s3); background: var(--bg-inset); border-radius: var(--r1); }
.faq-item h3 { margin-block-start: 0; }
.self-check-item summary { min-height: 44px; color: var(--text); font-weight: 600; cursor: pointer; }
.rights-list { display: grid; grid-template-columns: minmax(150px, .35fr) 1fr; gap: var(--s3); }
.rights-list dt { color: var(--accent); font-weight: 700; }
.rights-list dd { margin: 0; color: var(--text-2); }

@media (max-width: 960px) { .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) {
  .page-wrap { padding: var(--s4) var(--s3); }
  .card-grid { grid-template-columns: 1fr; }
  .claim-head { display: grid; }
  .claim-label { justify-self: start; }
  .rubric-list { grid-template-columns: 1fr; gap: var(--s2); }
  .rubric-list dd { margin-block-end: var(--s3); }
  .rights-list { grid-template-columns: 1fr; gap: var(--s2); }
  .rights-list dd { margin-block-end: var(--s3); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none; transition: none; }
}

<script>
document.addEventListener('DOMContentLoaded', () => {
  const APPROVED_SUBJECTS = ['Economics', 'History', 'Self-Improvement', 'AI', 'Intelligence & Security', 'Politics', 'Neuroscience', 'Education', 'Accessibility', 'Technology', 'Uncategorized'];
  const d = window.__DASHBOARD_DATA__ || {};
  const reports = (d.reports || []).filter(report => report.type === 'research');
  const resources = (d.resources || []).filter(resource => resource.title);
  const project001 = (d.project_001_insights || []).filter(insight => insight.title);

  function stripMd(text) {
    return (text || '')
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/\*(.+?)\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^#+\s*/gm, '')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
      .trim();
  }

  function inferReportSubject(report) {
    const text = `${report.title || ''} ${report.file || ''} ${report.preview || ''}`.toLowerCase();
    if (/accessib|a11y|wcag|screen reader/.test(text)) return 'Accessibility';
    if (/artificial intelligence|\bai\b|agent|model|llm/.test(text)) return 'AI';
    if (/neuroscience|brain|cognitive/.test(text)) return 'Neuroscience';
    if (/education|school|teaching|learning|student/.test(text)) return 'Education';
    if (/security|intelligence|osint|surveillance/.test(text)) return 'Intelligence & Security';
    if (/econom/.test(text)) return 'Economics';
    if (/histor/.test(text)) return 'History';
    if (/politic|government|election/.test(text)) return 'Politics';
    if (/technolog|software|web|css|code/.test(text)) return 'Technology';
    return 'Uncategorized';
  }

  function approvedSubject(subject) {
    return APPROVED_SUBJECTS.includes(subject) ? subject : 'Uncategorized';
  }

  const items = [
    ...resources.map(resource => ({
      sourceId: `resource:${resource.id}`,
      title: resource.title,
      subject: approvedSubject(resource.subject),
      tags: Array.isArray(resource.tags) ? resource.tags : [],
      status: resource.status || 'New',
      date: resource.added || '',
      summary: resource.note || '',
      keyPoints: resource.takeaways || [],
      takeaway: resource.takeaway || '',
      sourceText: resource.source_title || resource.source || '',
      links: resource.url ? [{ label: 'Open source', url: resource.url }] : [],
      sourceLanguage: resource.source_language || 'en',
      biasNote: resource.bias_note || '',
      blogAngle: resource.blog_angle || '',
      youngReader: resource.young_reader || null,
      evidenceReview: resource.evidence_review || null,
      blogDraft: resource.blog_draft || null,
      content: '',
    })),
    ...reports.map(report => ({
      sourceId: `report:${report.file}`,
      title: report.title || report.file,
      subject: approvedSubject(report.subject || inferReportSubject(report)),
      tags: Array.isArray(report.tags) ? report.tags : [],
      status: report.status || 'Processed',
      date: report.date || '',
      summary: stripMd(report.preview || ''),
      keyPoints: [],
      takeaway: report.takeaway || '',
      sourceText: report.file || '',
      links: Array.isArray(report.links) ? report.links : [],
      sourceLanguage: report.source_language || 'en',
      biasNote: report.bias_note || '',
      blogAngle: report.blog_angle || '',
      youngReader: report.young_reader || null,
      evidenceReview: report.evidence_review || null,
      blogDraft: report.blog_draft || null,
      content: report.content || '',
    })),
    ...project001.map(insight => ({
      sourceId: `project-001:${insight.id}`,
      title: insight.title,
      subject: approvedSubject(insight.subject),
      tags: Array.isArray(insight.tags) ? insight.tags : [],
      status: insight.status || 'Processed',
      date: insight.date || '',
      summary: insight.summary || '',
      keyPoints: insight.points || [],
      takeaway: insight.takeaway || '',
      sourceText: insight.source || '',
      links: insight.links || [],
      sourceLanguage: insight.source_language || 'en',
      biasNote: insight.bias_note || '',
      blogAngle: insight.blog_angle || '',
      youngReader: insight.young_reader || null,
      evidenceReview: insight.evidence_review || null,
      blogDraft: insight.blog_draft || null,
      content: '',
    })),
  ];
  const itemsBySourceId = new Map(items.map(item => [item.sourceId, item]));
  let selectedSubject = 'All';
  let selectedView = 'All';
  let lastFocused = null;

  const grid = document.querySelector('#knowledge-grid');
  const summary = document.querySelector('#library-summary');
  const overlay = document.querySelector('#report-modal');
  const modalTitle = document.querySelector('#modal-title');
  const modalSubject = document.querySelector('#modal-subject');
  const modalStatus = document.querySelector('#modal-status');
  const modalDate = document.querySelector('#modal-date');
  const modalBody = document.querySelector('#modal-body');
  const closeButton = document.querySelector('#modal-close-btn');
  const readAloudToggle = document.querySelector('#read-aloud-toggle');
  const readAloudLabel = document.querySelector('#read-aloud-label');
  const readAloudStop = document.querySelector('#read-aloud-stop');
  const readAloudSpeed = document.querySelector('#read-aloud-speed');
  const readAloudStatus = document.querySelector('#read-aloud-status');
  const readAloudSupported = Boolean(window.speechSynthesis && window.SpeechSynthesisUtterance && window.ReadAloud);
  let readableArticleText = '';
  let readableArticleLanguage = 'en';
  let reader = null;

  function updateReadAloudState(state) {
    const isSpeaking = state.status === 'speaking';
    const isPaused = state.status === 'paused';
    readAloudLabel.textContent = isSpeaking ? 'Pause' : (isPaused ? 'Resume' : 'Read aloud');
    readAloudStop.disabled = !isSpeaking && !isPaused;
    readAloudSpeed.disabled = isSpeaking || isPaused;
    readAloudStatus.textContent = state.message || '';
  }

  if (readAloudSupported) {
    reader = window.ReadAloud.createReadAloudController({
      synthesis: window.speechSynthesis,
      Utterance: window.SpeechSynthesisUtterance,
      onStateChange: updateReadAloudState,
    });
  } else {
    readAloudToggle.disabled = true;
    readAloudStop.disabled = true;
    readAloudSpeed.disabled = true;
    readAloudStatus.textContent = 'Read aloud is unavailable on this device.';
  }

  function matchesView(item) {
    if (selectedView === 'All') return true;
    if (selectedView === 'Blog material') return item.tags.includes('Blog material');
    return item.status.toLowerCase() === 'to explore';
  }

  function renderCards() {
    const visible = items.filter(item =>
      (selectedSubject === 'All' || item.subject === selectedSubject) && matchesView(item)
    );
    summary.textContent = `${visible.length} ${visible.length === 1 ? 'item' : 'items'} shown`;
    if (!visible.length) {
      grid.innerHTML = '<div class="empty">No knowledge matches these filters</div>';
      return;
    }
    grid.innerHTML = visible.map(item => `
      <button type="button" class="report-card" data-source-id="${esc(item.sourceId)}" aria-label="Open ${esc(item.title)}">
        <span class="card-accent"></span>
        <span class="card-body">
          <span class="card-meta">
            <span class="type-badge">${esc(item.subject)}</span>
            <span class="type-badge status-badge">${esc(item.status)}</span>
          </span>
          <span class="card-title">${esc(item.title)}</span>
          <span class="card-date">${esc(item.date)}</span>
          <span class="card-preview">${esc(item.summary)}</span>
        </span>
      </button>
    `).join('');
  }

  function detailSection(title, content) {
    if (!content) return '';
    return `<section class="detail-section"><h2>${esc(title)}</h2>${content}</section>`;
  }

  function openModal(item, trigger) {
    lastFocused = trigger;
    modalTitle.textContent = item.title;
    modalSubject.textContent = item.subject;
    modalStatus.textContent = item.status;
    modalDate.textContent = item.date;

    const summaryHtml = item.content ? renderMd(item.content) : `<p>${esc(item.summary)}</p>`;
    const pointsHtml = item.keyPoints.length
      ? `<ul>${item.keyPoints.map(point => `<li>${esc(point)}</li>`).join('')}</ul>`
      : '<p>No separate key points recorded.</p>';
    const linksHtml = item.links.length
      ? `<div class="source-links">${item.links.map(link => `<a class="source-link" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">${esc(link.label || link.url)}</a>`).join('')}</div>`
      : '<p>No external link recorded.</p>';
    const sourceMeta = item.sourceText
      ? `<p>${esc(item.sourceText)}</p><p>Source language: ${esc(item.sourceLanguage)}</p>`
      : `<p>Source language: ${esc(item.sourceLanguage)}</p>`;
    const young = item.youngReader;
    const youngReaderHtml = young
      ? `<p>${esc(young.summary || '')}</p>`
        + (young.key_points?.length
          ? `<h3>Key ideas</h3><ul>${young.key_points.map(point => `<li>${esc(point)}</li>`).join('')}</ul>`
          : '')
      : '';
    const activitiesHtml = young?.activities?.length
      ? `<ul>${young.activities.map(activity => `<li>${esc(activity)}</li>`).join('')}</ul>`
      : '';
    const qualityHtml = young
      ? `<p><strong>Verdict:</strong> ${esc(young.verdict || '')}</p>`
        + `<p><strong>Target:</strong> Grades ${esc(young.target_grades || '')}</p>`
        + `<p><strong>Measured reading grade:</strong> ${esc(young.reading_grade ?? 'Not measured')}</p>`
        + `<p>${esc(young.quality_note || '')}</p>`
      : '';
    const evidence = item.evidenceReview;
    const claimClass = label => `claim-${String(label || '').toLowerCase().replace(/\s+/g, '-')}`;
    const claimsHtml = evidence?.claims?.length
      ? `<div class="evidence-claims">${evidence.claims.map(claim => {
          const citations = (claim.citations || []).map(citation =>
            `<li><a href="${esc(citation.url)}" target="_blank" rel="noopener noreferrer">${esc(citation.title)}</a>`
              + ` — ${esc(citation.publisher || '')}${citation.published ? ` (${esc(citation.published)})` : ''}</li>`
          ).join('');
          return `<article class="evidence-claim">`
            + `<div class="claim-head"><h3>${esc(claim.claim || '')}</h3><span class="claim-label ${claimClass(claim.label)}">${esc(claim.label || '')}</span></div>`
            + `<p>${esc(claim.note || '')}</p>`
            + (citations ? `<ul class="citation-list">${citations}</ul>` : '')
            + `</article>`;
        }).join('')}</div>`
      : '';
    const rubricLabels = {
      source_diversity: 'Source diversity',
      missing_context: 'Missing context',
      bias_framing: 'Bias and framing',
      reading_level: 'Reading level',
      child_suitability: 'Child suitability',
      actionability: 'Actionability',
    };
    const rubricHtml = evidence?.rubric
      ? `<dl class="rubric-list">${Object.entries(rubricLabels).map(([key, label]) =>
          evidence.rubric[key] ? `<dt>${esc(label)}</dt><dd>${esc(evidence.rubric[key])}</dd>` : ''
        ).join('')}</dl>`
      : '';
    const decision = evidence?.decision;
    const decisionHtml = decision
      ? `<p><strong>Decision:</strong> ${esc(decision.status || '')}</p><p>${esc(decision.reason || '')}</p>`
      : '';
    const revisionsHtml = decision?.required_revisions?.length
      ? `<ul>${decision.required_revisions.map(revision => `<li>${esc(revision)}</li>`).join('')}</ul>`
      : '';
    const draft = item.blogDraft;
    const draftSources = new Map((draft?.sources || []).map(source => [String(source.id), source]));
    const renderDraftCitations = ids => {
      const links = (ids || []).map(id => {
        const source = draftSources.get(String(id));
        return source ? `<a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer" aria-label="Source ${esc(id)}: ${esc(source.title)}">[${esc(id)}]</a>` : '';
      }).join('');
      return links ? `<span class="inline-citations">${links}</span>` : '';
    };
    const renderCitedText = (text, ids) => {
      const sentences = String(text || '').match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [];
      return sentences.map(sentence => `${esc(sentence.trim())}${renderDraftCitations(ids)}`).join(' ');
    };
    const draftStatusHtml = draft
      ? `<p><strong>Draft state:</strong> ${esc(draft.state || '')}</p><p><strong>Audience:</strong> ${esc(draft.audience || '')}</p>`
        + `<p><strong>Draft reading grade:</strong> ${esc(draft.reading_grade ?? 'Not measured')}</p>`
        + `<p class="draft-disclosure">${esc(draft.disclosure || '')}</p>`
      : '';
    const articleHtml = draft
      ? `<article class="draft-article"><h3>${esc(draft.title || '')}</h3><p>${renderCitedText(draft.introduction, draft.introduction_citations)}</p>`
        + (draft.sections || []).map(section => `<section class="draft-section"><h3>${esc(section.heading || '')}</h3>`
          + (section.paragraphs || []).map(paragraph => `<p>${renderCitedText(paragraph.text, paragraph.citations)}</p>`).join('')
          + `</section>`).join('') + `</article>`
      : '';
    const draftIdeasHtml = draft?.key_ideas?.length
      ? `<ul>${draft.key_ideas.map(idea => `<li>${renderCitedText(idea.text, idea.citations)}</li>`).join('')}</ul>`
      : '';
    const youngDraft = draft?.young_reader_variant;
    const youngDraftHtml = youngDraft
      ? `<p>${esc(youngDraft.summary || '')}</p>`
        + (youngDraft.key_points?.length ? `<ul>${youngDraft.key_points.map(point => `<li>${esc(point)}</li>`).join('')}</ul>` : '')
      : '';
    const faqHtml = draft?.faqs?.length
      ? `<div class="faq-list">${draft.faqs.map(faq => `<article class="faq-item"><h3>${esc(faq.question || '')}</h3><p>${renderCitedText(faq.answer, faq.citations)}</p></article>`).join('')}</div>`
      : '';
    const selfCheckHtml = draft?.self_check?.length
      ? `<div class="self-check-list">${draft.self_check.map(check => `<details class="self-check-item"><summary>${esc(check.question || '')}</summary><p>${renderCitedText(check.answer, check.citations)}</p></details>`).join('')}</div>`
      : '';
    const draftSourcesHtml = draft?.sources?.length
      ? `<ol class="citation-list">${draft.sources.map(source => `<li><a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.title)}</a> — ${esc(source.publisher || '')} · ${esc(source.role || '')}</li>`).join('')}</ol>`
      : '';
    const rightsLabels = {
      use_context: 'Use context',
      source_license: 'Source license',
      attribution: 'Attribution',
      quotation_limits: 'Quotation limits',
      media_reuse: 'Image / media reuse',
      permission_needed: 'Permission needed',
      review_status: 'Review status',
    };
    const rights = draft?.rights;
    const rightsHtml = rights
      ? `<dl class="rights-list">${Object.entries(rightsLabels).map(([key, label]) => `<dt>${esc(label)}</dt><dd>${esc(rights[key] || '')}</dd>`).join('')}</dl>`
        + (rights.reference_links?.length ? `<div class="source-links">${rights.reference_links.map(link => `<a class="source-link" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">${esc(link.title)}</a>`).join('')}</div>` : '')
      : '';
    const publicationHtml = draft?.publication
      ? `<div class="publication-lock"><p><strong>External publication:</strong> ${esc(draft.publication.external_status || '')}</p><p>${esc(draft.publication.approval_note || '')}</p></div>`
      : '';

    modalBody.innerHTML = [
      detailSection('Standard Summary', summaryHtml),
      detailSection('Standard Key Points', pointsHtml),
      detailSection('Why it matters / takeaway', `<p>${esc(item.takeaway || 'No separate takeaway recorded.')}</p>`),
      detailSection('Young Reader Version', youngReaderHtml),
      detailSection('Try It Yourself', activitiesHtml),
      detailSection('Young Reader Quality Review', qualityHtml),
      detailSection('Evidence Review', claimsHtml),
      detailSection('Editorial Rubric', rubricHtml),
      detailSection('Editorial Decision', decisionHtml),
      detailSection('Required Revisions', revisionsHtml),
      detailSection('Draft Status', draftStatusHtml),
      detailSection('Blog Draft', articleHtml),
      detailSection('Key Ideas', draftIdeasHtml),
      detailSection('Young Reader Draft', youngDraftHtml),
      detailSection('Frequently Asked Questions', faqHtml),
      detailSection('Check Your Understanding', selfCheckHtml),
      detailSection('Draft Sources', draftSourcesHtml),
      detailSection('Rights & Reuse', rightsHtml),
      detailSection('Publication Approval', publicationHtml),
      detailSection('Sources', sourceMeta + linksHtml),
      detailSection('Bias / reliability note', `<p>${esc(item.biasNote || 'No separate bias or reliability note recorded.')}</p>`),
      detailSection('Blog / story angle', `<p>${esc(item.blogAngle || 'No separate blog or story angle recorded.')}</p>`),
    ].join('');
    if (reader?.getStatus() !== 'idle') reader.stop();
    const readableArticle = modalBody.querySelector('.draft-article') || modalBody.querySelector('.detail-section');
    readableArticleText = readableArticle?.innerText.trim() || '';
    readableArticleLanguage = item.sourceLanguage || 'en';
    readAloudToggle.disabled = !readAloudSupported || !readableArticleText;
    readAloudStatus.textContent = !readAloudSupported
      ? 'Read aloud is unavailable on this device.'
      : (readableArticleText ? '' : 'There is no article text to read.');
    overlay.removeAttribute('hidden');
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    closeButton.focus();
  }

  function closeModal() {
    if (reader?.getStatus() !== 'idle') reader.stop();
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    overlay.setAttribute('hidden', '');
    document.body.style.overflow = '';
    if (lastFocused) lastFocused.focus();
  }

  function setupFilterBar(selector, dataKey, onSelect) {
    const bar = document.querySelector(selector);
    bar.addEventListener('click', event => {
      const button = event.target.closest(`button[${dataKey}]`);
      if (!button) return;
      bar.querySelectorAll('button').forEach(candidate => candidate.setAttribute('aria-pressed', String(candidate === button)));
      onSelect(button.getAttribute(dataKey));
      renderCards();
    });
  }

  setupFilterBar('#subject-filters', 'data-subject', value => { selectedSubject = value; });
  setupFilterBar('#view-filters', 'data-view', value => { selectedView = value; });
  grid.addEventListener('click', event => {
    const card = event.target.closest('[data-source-id]');
    if (!card) return;
    const item = itemsBySourceId.get(card.dataset.sourceId);
    if (item) openModal(item, card);
  });
  closeButton.addEventListener('click', closeModal);
  readAloudToggle.addEventListener('click', () => {
    if (!reader) return;
    const status = reader.getStatus();
    if (status === 'speaking') reader.pause();
    else if (status === 'paused') reader.resume();
    else reader.read(readableArticleText, {
      language: readableArticleLanguage,
      rate: Number(readAloudSpeed.value),
    });
  });
  readAloudStop.addEventListener('click', () => reader?.stop());
  overlay.addEventListener('click', event => { if (event.target === overlay) closeModal(); });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && overlay.classList.contains('open')) closeModal();
    if (event.key === 'Tab' && overlay.classList.contains('open')) {
      const focusable = [...overlay.querySelectorAll('button, a[href]')];
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
  });

  renderCards();
  if (typeof lucide !== 'undefined') lucide.createIcons();

  const params = new URLSearchParams(window.location.search);
  const openFile = params.get('open');
  if (openFile) {
    const target = items.find(item => item.sourceId === `report:${openFile}`);
    if (target) openModal(target, null);
  }
});
</script>
<script src="../pwa.js" defer></script>
</body>
</html>
